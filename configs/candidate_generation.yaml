# Candidate Pair Generation Configuration

max_jobs_per_resume_per_strategy: 20
semantic_top_k: 15
random_negative_ratio: 1.0
hard_negative_ratio: 1.0

positive_threshold:
  min_skill_jaccard: 0.15
  min_semantic_similarity: 0.55
  min_title_similarity: 0.45

negative_threshold:
  max_skill_jaccard: 0.05
  max_semantic_similarity: 0.35

train_ratio: 0.70
validation_ratio: 0.15
test_ratio: 0.15

random_seed: 42

embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
embedding_batch_size: 64
